<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Ciryaco de Andrade - Projetos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00ff41;
            --secondary-color: #0a0a0a;
            --light-color: #ffffff;
            --shadow: 0 4px 6px rgba(0, 255, 65, 0.3);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--light-color);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        .matrix-code {
            position: absolute;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            font-size: 18px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        header {
            background-color: rgba(10, 10, 10, 0.9);
            color: var(--light-color);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        header.scrolled {
            padding: 0.5rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-color);
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .projects {
            padding: 150px 0 100px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
            color: var(--light-color);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 10px auto;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background-color: rgba(30, 30, 30, 0.8);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.2);
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }

        .project-img {
            height: 250px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .project-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .project-card:hover .project-img img {
            transform: scale(1.1);
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-size: 1.3rem;
        }

        .project-info p {
            margin-bottom: 1rem;
            color: #ccc;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .tech-tag {
            background-color: rgba(0, 255, 65, 0.1);
            color: var(--primary-color);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .project-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .project-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(0, 255, 65, 0.1);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 5px;
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .project-links a:hover {
            background-color: var(--primary-color);
            color: var(--secondary-color);
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(10, 10, 10, 0.95);
                flex-direction: column;
                padding: 1rem 0;
                text-align: center;
                z-index: 1000;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                margin: 0.5rem 0;
            }

            .hamburger {
                display: block;
            }

            .projects-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        function displayProjects() {
            const container = document.getElementById('projects-container');
            
            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card animate-on-scroll';
                
                card.innerHTML = `
                    <div class="project-img">
                        <img src="${project.image}" alt="${project.title}" onerror="this.style.display='none'; this.parentElement.innerHTML += '<i class=\'fas fa-laptop-code\'></i>'">
                    </div>
                    <div class="project-info">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                        <div class="project-tech">
                            ${project.tech.map(t => `<span class="tech-tag">${t}</span>`).join('')}
                        </div>
                        <div class="project-links">
                            <a href="${project.link}" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Online</a>
                            ${project.github ? `<a href="${project.github}" target="_blank"><i class="fab fa-github"></i> GitHub</a>` : ''}
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });

            observeElements();
        }

        // Matrix background
        function createMatrix() {
            const matrixBg = document.getElementById('matrix-bg');
            const chars = '01';
            const fontSize = 18;
            const columns = Math.floor(window.innerWidth / fontSize);
            
            for (let i = 0; i < columns; i++) {
                const code = document.createElement('div');
                code.className = 'matrix-code';
                code.style.left = `${i * fontSize}px`;
                code.style.animationDuration = `${Math.random() * 5 + 5}s`;
                code.style.animationDelay = `${Math.random() * 5}s`;
                
                let content = '';
                const rows = Math.floor(window.innerHeight / fontSize);
                for (let j = 0; j < rows; j++) {
                    content += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                code.textContent = content;
                matrixBg.appendChild(code);
            }
        }

        // Menu hamburger
        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
        });

        // Header scroll
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (window.scrollY > 100) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Observador de animações
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach(element => {
                observer.observe(element);
            });
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', () => {
            createMatrix();
            displayProjects();
        });
    </script>
</body>
