        /* ===== SEU CSS ORIGINAL (mantido intacto) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00ff41;
            --secondary-color: #0a0a0a;
            --light-color: #ffffff;
            --shadow: 0 4px 6px rgba(0, 255, 65, 0.3);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--light-color);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        .matrix-code {
            position: absolute;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            font-size: 18px;
            animation: fall linear infinite;
            white-space: pre;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        header {
            background-color: rgba(10, 10, 10, 0.95);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        header.scrolled {
            padding: 0.5rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-color);
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 500;
            padding: 0.5rem 0;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .projects {
            padding: 120px 0 80px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 10px auto;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background-color: rgba(30, 30, 30, 0.85);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.2);
            backdrop-filter: blur(5px);
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.2);
        }

        .project-img {
            height: 180px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .project-img i {
            font-size: 4rem;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .project-info p {
            margin-bottom: 1rem;
            color: #ccc;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }

        .tech-tag {
            background-color: rgba(0, 255, 65, 0.1);
            color: var(--primary-color);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .project-links {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .project-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            background-color: rgba(0, 255, 65, 0.1);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.3);
            font-size: 0.8rem;
        }

        .project-links a:hover {
            background-color: var(--primary-color);
            color: var(--secondary-color);
        }

        .highlight-project {
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
            position: relative;
            overflow: hidden;
        }

        .highlight-project::before {
            content: '⭐ DESTAQUE PRINCIPAL ⭐';
            position: absolute;
            top: 12px;
            right: -35px;
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: 4px 35px;
            transform: rotate(45deg);
            font-size: 0.65rem;
            font-weight: bold;
            z-index: 10;
            letter-spacing: 1px;
        }

        .company-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .new-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 10;
            animation: pulse 1.5s infinite;
        }

        .fullstack-badge {
            position: absolute;
            top: 55px;
            left: 12px;
            background: #ff8800;
            color: #000;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 10;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 15px #ff8800;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        footer {

            background-color: rgba(10, 10, 10, 0.9);

                left: 0;

            }

                margin: 0.8rem 0;
            }

                display: block;
            }

            }

                let linksHtml = `<a href="${project.link}" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Online</a>`;
                if (project.github) {
                    linksHtml += `<a href="${project.github}" target="_blank"><i class="fab fa-github"></i> GitHub</a>`;
                }
                
                let badgesHtml = '';
                if (project.isCompany) {
                    badgesHtml += `<div class="company-badge"><i class="fas fa-building"></i> Minha Empresa</div>`;
                }
                if (project.isNew && !project.isFullStack) {
                    badgesHtml += `<div class="new-badge"><i class="fas fa-star"></i> NOVO</div>`;
                }
                if (project.isFullStack) {
                    badgesHtml += `<div class="fullstack-badge"><i class="fas fa-rocket"></i> FULL STACK</div>`;
                }
                
                card.innerHTML = `
                    <div class="project-img" style="position: relative;">
                        ${badgesHtml}
                        <i class="fas ${project.icon}" style="font-size: 3.5rem;"></i>
                    </div>
                    <div class="project-info">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                        <div class="project-tech">${techTags}</div>
                        <div class="project-links">${linksHtml}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });

            observeElements();
        }

        // ===== EFEITO MATRIX =====
        function createMatrix() {
            const matrixBg = document.getElementById('matrix-bg');
            if (!matrixBg) return;
            
            const chars = '01';
            const fontSize = 18;
            const columns = Math.floor(window.innerWidth / fontSize);
            matrixBg.innerHTML = '';
            
            for (let i = 0; i < columns; i++) {
                const code = document.createElement('div');
                code.className = 'matrix-code';
                code.style.left = `${i * fontSize}px`;
                code.style.animationDuration = `${Math.random() * 5 + 5}s`;
                code.style.animationDelay = `${Math.random() * 5}s`;
                
                let content = '';
                const rows = Math.floor(window.innerHeight / fontSize);
                for (let j = 0; j < rows; j++) {
                    content += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                code.textContent = content;
                matrixBg.appendChild(code);
            }
        }

        // ===== OBSERVADOR DE SCROLL =====
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach(element => {
                observer.observe(element);
            });
        }

        // ===== MENU HAMBURGUER =====
        const hamburger = document.querySelector('.hamburger');
        if (hamburger) {
            hamburger.addEventListener('click', function() {
                document.querySelector('.nav-links').classList.toggle('active');
            });
        }

        // ===== SCROLL HEADER =====
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (header) {
                if (window.scrollY > 100) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            }
        });

        // ===== REDIMENSIONAR =====
        window.addEventListener('resize', () => {
            createMatrix();
        });

        // ===== INICIALIZAÇÃO =====
        window.addEventListener('DOMContentLoaded', () => {
            createMatrix();
            displayProjects();
        });
    </script>
</body>
</html>
