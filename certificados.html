<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00ff41;
            --secondary-color: #0a0a0a;
            --light-color: #ffffff;
            --shadow: 0 4px 6px rgba(0, 255, 65, 0.3);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--light-color);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            background-color: var(--secondary-color);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-color);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            font-weight: 500;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .certificates {
            padding: 150px 0 50px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 15px auto;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.8rem 1.8rem;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto 2.5rem;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary-color);
            border-radius: 50px;
            color: var(--light-color);
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .certificate-card {
            background: linear-gradient(145deg, #111, #1a1a1a);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 65, 0.1);
            cursor: pointer;
            transition: var(--transition);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .certificate-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px rgba(0, 255, 65, 0.2);
        }

        .certificate-card.special {
            border: 3px solid var(--primary-color);
            position: relative;
        }

        .certificate-card.special::before {
            content: '⭐ DESTAQUE';
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: 0.4rem 1.2rem;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.8rem;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(0, 255, 65, 0.3);
        }

        .certificate-preview {
            height: 220px;
            background: linear-gradient(45deg, #1a1a1a, #222);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .certificate-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .certificate-preview i {
            font-size: 5rem;
            color: var(--primary-color);
            opacity: 0.8;
            filter: drop-shadow(0 0 20px rgba(0, 255, 65, 0.5));
        }

        .certificate-info {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 255, 65, 0.2);
            flex: 1;
        }

        .certificate-info h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .certificate-meta {
            display: flex;
            justify-content: space-between;
            margin: 0.8rem 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        .certificate-meta i {
            color: var(--primary-color);
            margin-right: 0.3rem;
        }

        .certificate-description {
            color: #bbb;
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .view-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .view-link i {
            margin-left: 0.3rem;
            transition: var(--transition);
        }

        .certificate-card:hover .view-link i {
            transform: translateX(5px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .modal-header {
            background: var(--secondary-color);
            color: var(--primary-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
        }

        .modal-header h3 {
            font-size: 1.2rem;
            max-width: 80%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 15px;
        }

        .close-modal:hover {
            color: var(--light-color);
        }

        .modal-body {
            flex: 1;
            background: #f0f0f0;
            overflow: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .certificate-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .download-btn {
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: var(--transition);
            border: 2px solid var(--primary-color);
        }

        .download-btn:hover {
            background: transparent;
            color: var(--primary-color);
        }

        .no-pdf {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .no-pdf i {
            font-size: 5rem;
            color: #999;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .page-btn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--primary-color);
            color: var(--secondary-color);
            transform: scale(1.1);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .no-results {
            text-align: center;
            padding: 4rem;
            color: #888;
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--secondary-color);
                flex-direction: column;
                padding: 1rem 0;
                text-align: center;
                border-top: 2px solid var(--primary-color);
            }

            .nav-links.active {
                display: flex;
            }

            .hamburger {
                display: block;
            }

            .filters {
                gap: 0.5rem;
            }

            .filter-btn {
                padding: 0.6rem 1.2rem;
                font-size: 0.85rem;
            }

            .certificates-grid {
                grid-template-columns: 1fr;
            }

            .modal-header h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>

            // ===== CERTIFICADOS SANTANDER RAG (PDFs 2026) =====
            { 
                id: 215, 
                title: 'Santander - RAG com ChromaDB, LlamaIndex e Python', 
                category: 'pdf', 
                hours: 2, 
                date: '2026-10-14', 
                description: 'Aceleração Santander - RAG com ChromaDB, LlamaIndex e Python - DIO', 
                image: 'https://i.postimg.cc/qBWggdgq/4.png', 
                code: '3QKQ5PLT',
                special: true 
            },
            { 
                id: 216, 
                title: 'Aceleração Santander - Dados com Python e IA', 
                category: 'pdf', 
                hours: 2, 
                date: '2026-10-14', 
                description: 'Módulo Aceleração Santander - Dados com Python e IA - DIO', 
                code: 'YBASTHKB' 
            },
            { 
                id: 217, 
                title: 'Criando seu Primeiro RAG: Conectando Dados à IA Generativa', 
                category: 'pdf', 
                hours: 1, 
                date: '2026-10-14', 
                description: 'Curso Criando seu Primeiro RAG - DIO' 
            },
            { 
                id: 218, 
                title: 'Boas vindas à Aceleração Santander - RAG com ChromaDB, LlamaIndex e Python', 
                category: 'pdf', 
                hours: 1, 
                date: '2026-09-17', 
                description: 'Boas-vindas à Aceleração Santander RAG - DIO' 
            }
        ];

        // Re-indexar IDs
        certificates.forEach((cert, index) => { cert.id = index + 1; });

        const modal = document.getElementById('certModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.getElementById('closeModal');
        const grid = document.getElementById('certificatesGrid');
        const paginationDiv = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        let currentPage = 1;
        let currentFilter = 'all';
        let searchTerm = '';
        const itemsPerPage = 12;

        function openCertificate(cert) {
            modalTitle.textContent = cert.title;

            if (cert.image) {
                modalBody.innerHTML = `
                    <a href="${cert.image}" class="download-btn" download="${cert.title.replace(/[^a-z0-9]/gi, '_')}.png">
                        <i class="fas fa-download"></i> Baixar Certificado
                    </a>
                    <img src="${cert.image}" class="certificate-image" alt="${cert.title}" onerror="this.onerror=null; this.src=''; this.parentElement.innerHTML+='<div class=\'no-pdf\'><i class=\'fas fa-exclamation-triangle\'></i><h3>Imagem não disponível</h3><p>O link da imagem pode estar quebrado</p></div>';">
                `;
            } else {
                modalBody.innerHTML = `
                    <div class="no-pdf">
                        <i class="fas fa-certificate"></i>
                        <h3>Certificado sem imagem</h3>
                        <p>Este certificado não possui arquivo de imagem disponível</p>
                        <p style="margin-top: 20px; color: #00ff41; font-weight: bold;">${cert.title}</p>
                        <p>${cert.description}</p>
                        <p>Carga horária: ${cert.hours}h</p>
                        <p>Data: ${new Date(cert.date).toLocaleDateString('pt-BR')}</p>
                        ${cert.code ? `<p style="margin-top: 15px; color: #00ff41;"><strong>Código de Validação:</strong> ${cert.code}</p>` : ''}
                    </div>
                `;
            }

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            modalBody.innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        closeBtn.onclick = closeModal;
        window.onclick = (e) => {
            if (e.target === modal) closeModal();
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'block') {
                closeModal();
            }
        });

        function filterCertificates() {
            return certificates.filter(cert => {
                if (currentFilter === 'destaques') {
                    return cert.special === true;
                }
                const matchesFilter = currentFilter === 'all' || cert.category === currentFilter;
                const matchesSearch = cert.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    cert.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesFilter && matchesSearch;
            });
        }

        function displayCertificates() {
            const filtered = filterCertificates();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageCerts = filtered.slice(start, end);

            grid.innerHTML = '';

            if (pageCerts.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>Nenhum certificado encontrado</p>
                    </div>
                `;
                paginationDiv.innerHTML = '';
                return;
            }

            pageCerts.forEach(cert => {
                const card = document.createElement('div');
                card.className = `certificate-card ${cert.special ? 'special' : ''}`;
                card.onclick = () => openCertificate(cert);

                const previewContent = cert.image 
                    ? `<img src="${cert.image}" alt="${cert.title}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-certificate\\'></i>';">`
                    : `<i class="fas fa-certificate"></i>`;

                card.innerHTML = `
                    <div class="certificate-preview">
                        ${previewContent}
                    </div>
                    <div class="certificate-info">
                        <h3>${cert.title}</h3>
                        <div class="certificate-meta">
                            <span><i class="fas fa-calendar"></i> ${new Date(cert.date).toLocaleDateString('pt-BR')}</span>
                            <span><i class="fas fa-clock"></i> ${cert.hours}h</span>
                        </div>
                        <p class="certificate-description">${cert.description}</p>
                        <span class="view-link">
                            <i class="fas fa-eye"></i> Visualizar
                        </span>
                    </div>
                `;

                grid.appendChild(card);
            });

            updatePagination(totalPages);
            updateFilterCounts();
        }

        function updatePagination(totalPages) {
            paginationDiv.innerHTML = '';

            paginationDiv.innerHTML += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                paginationDiv.innerHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            paginationDiv.innerHTML += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
        }

        window.changePage = (page) => {
            const filtered = filterCertificates();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);

            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                displayCertificates();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function updateFilterCounts() {
            const total = certificates.length;
            const destaquesCount = certificates.filter(c => c.special === true).length;
            const pdfCount = certificates.filter(c => c.category === 'pdf').length;
            const mlCount = certificates.filter(c => c.category === 'ml').length;
            const nodejsCount = certificates.filter(c => c.category === 'nodejs').length;
            const progCount = certificates.filter(c => c.category === 'programacao').length;
            const officeCount = certificates.filter(c => c.category === 'office').length;
            const ibmbobCount = certificates.filter(c => c.category === 'ibmbob').length;

            filterBtns[0].textContent = `Todos (${total})`;
            filterBtns[1].textContent = `⭐ Destaques (${destaquesCount})`;
            filterBtns[2].textContent = `PDFs (${pdfCount})`;
            filterBtns[3].textContent = `Machine Learning (${mlCount})`;
            filterBtns[4].textContent = `Node.js (${nodejsCount})`;
            filterBtns[5].textContent = `Programação (${progCount})`;
            filterBtns[6].textContent = `Office (${officeCount})`;
            filterBtns[7].textContent = `IBM Bob (${ibmbobCount})`;
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                currentPage = 1;
                displayCertificates();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            currentPage = 1;
            displayCertificates();
        });

        if (hamburger) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }

        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 100) {
                header.style.background = 'rgba(10, 10, 10, 0.95)';
                header.style.backdropFilter = 'blur(10px)';
            } else {
                header.style.background = 'var(--secondary-color)';
                header.style.backdropFilter = 'none';
            }
        });

        displayCertificates();
    </script>
