<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Ciryaco de Andrade - Certificados</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00ff41;
            --secondary-color: #0a0a0a;
            --light-color: #ffffff;
            --shadow: 0 4px 6px rgba(0, 255, 65, 0.3);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--light-color);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        .matrix-code {
            position: absolute;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            font-size: 18px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        header {
            background-color: rgba(10, 10, 10, 0.9);
            color: var(--light-color);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        header.scrolled {
            padding: 0.5rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--light-color);
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-color);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .certificates {
            padding: 150px 0 100px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
            color: var(--light-color);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 10px auto;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: var(--secondary-color);
        }

        .search-box {
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .search-box input {
            width: 100%;
            padding: 1rem;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid var(--primary-color);
            border-radius: 5px;
            color: var(--light-color);
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 255, 65, 0.3);
        }

        .certificates-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .certificate-card {
            background-color: rgba(30, 30, 30, 0.8);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0, 255, 65, 0.2);
            cursor: pointer;
        }

        .certificate-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }

        .certificate-card.special {
            border: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        .certificate-card.special::before {
            content: '⭐ DESTAQUE';
            position: absolute;
            top: 20px;
            right: -30px;
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: 0.3rem 3rem;
            transform: rotate(45deg);
            font-weight: bold;
            font-size: 0.8rem;
            z-index: 10;
        }

        .certificate-img {
            height: 200px;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .certificate-img i {
            font-size: 4rem;
            color: var(--primary-color);
        }

        .certificate-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .certificate-card:hover .certificate-img img {
            transform: scale(1.1);
        }

        .certificate-info {
            padding: 1.5rem;
        }

        .certificate-info h3 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .certificate-meta {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            padding: 0.3rem 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            font-size: 0.9rem;
        }

        .certificate-meta i {
            color: var(--primary-color);
            margin-right: 0.3rem;
        }

        .certificate-description {
            color: #ccc;
            font-size: 0.9rem;
            margin: 0.5rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            background-color: var(--secondary-color);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--primary-color);
            position: relative;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            display: block;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: var(--light-color);
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 10;
        }

        .close-modal:hover {
            color: var(--primary-color);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 0.5rem 1rem;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition);
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--primary-color);
            color: var(--secondary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #888;
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(10, 10, 10, 0.95);
                flex-direction: column;
                padding: 1rem 0;
                text-align: center;
                z-index: 1000;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                margin: 0.5rem 0;
            }

            .hamburger {
                display: block;
            }

            .filters {
                flex-direction: column;
                align-items: center;
            }

            .filter-btn {
                width: 100%;
                max-width: 300px;
            }

            .certificates-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function displayCertificates() {
            const container = document.getElementById('certificates-container');

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginated = filtered.slice(start, end);

            if (paginated.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>Nenhum certificado encontrado</p>
                    </div>
                `;
                return;
            }

            paginated.forEach(cert => {
                const card = document.createElement('div');
                card.className = `certificate-card animate-on-scroll ${cert.special ? 'special' : ''}`;
                card.innerHTML = `
                    <div class="certificate-img">

                    <div class="certificate-info">

                card.onclick = () => openModal(cert.image);
                container.appendChild(card);
            });

            updatePagination(filtered.length);
            observeElements();
        }

        function filterCertificates() {
            return allCertificates.filter(cert => {
                const matchesFilter = currentFilter === 'all' || cert.category === currentFilter;
                const matchesSearch = cert.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    cert.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesFilter && matchesSearch;
            });
        }

        function updatePagination(total) {
            const totalPages = Math.ceil(total / itemsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            pagination.innerHTML += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;

            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            pagination.innerHTML += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
        }

        // Matrix background
        function createMatrix() {
            const matrixBg = document.getElementById('matrix-bg');
            const chars = '01';
            const fontSize = 18;
            const columns = Math.floor(window.innerWidth / fontSize);
            
            for (let i = 0; i < columns; i++) {
                const code = document.createElement('div');
                code.className = 'matrix-code';
                code.style.left = `${i * fontSize}px`;
                code.style.animationDuration = `${Math.random() * 5 + 5}s`;
                code.style.animationDelay = `${Math.random() * 5}s`;
                
                let content = '';
                const rows = Math.floor(window.innerHeight / fontSize);
                for (let j = 0; j < rows; j++) {
                    content += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                code.textContent = content;
                matrixBg.appendChild(code);
            }
        }

            }
        });

        // Observador de animações
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach(element => {
                observer.observe(element);
            });
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', () => {
            createMatrix();
            displayCertificates();
        });
    </script>
</body>
</html>
